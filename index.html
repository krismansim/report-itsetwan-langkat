<script>
/* ======================= KONEKSI KE BACKEND ======================= */
async function prCallServer(fn, ...args){
 if(typeof google !== 'undefined' && google.script && google.script.run){
 return new Promise((resolve, reject) => {
 google.script.run.withSuccessHandler(resolve)
 .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))[fn](...args);
 });
 }
 if(typeof WEB_APP_URL === 'undefined' || String(WEB_APP_URL).indexOf('https://') !== 0) throw new Error('WEB_APP_URL belum diisi.');
 let res;
 try{
 res = await fetch(WEB_APP_URL, {
 method:'POST',
 headers:{ 'Content-Type':'text/plain;charset=utf-8' },
 body: JSON.stringify({ action:'presensi', fn, args })
 });
 }catch(e){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); }
 const teks = await res.text();
 try{ return JSON.parse(teks); }
 catch(e){ throw new Error('Respons server tidak valid. Pastikan Code.gs & Presensi.gs sudah di-deploy versi baru.'); }
}

/* ======================= STATE & UTILITAS ======================= */
const PR_STATE = { data:null, lokasi:null, fotoAsli:null, sedangKirim:false, offsetMs:0, container:null };

function prEsc(s){
 return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function prJarak(lat1, lng1, lat2, lng2){
 const R = 6371000, rad = x => x * Math.PI / 180;
 const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
 const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2)**2;
 return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function prFormatJarak(m){
 m = Number(m) || 0;
 return m >= 1000 ? (m/1000).toFixed(1).replace('.', ',') + ' km' : m + ' m';
}
function prMapsUrl(lat, lng){
 return (lat === null || lat === undefined) ? '#' : `https://www.google.com/maps?q=${lat},${lng}`;
}
function prSekarangMs(){ return Date.now() + (PR_STATE.offsetMs || 0); }
// Waktu WIB (UTC+7) tanpa tergantung zona waktu HP
function prWIB(ms){
 const d = new Date((ms === undefined ? prSekarangMs() : ms) + 7 * 3600000);
 const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, dd = d.getUTCDate();
 return { y, m, d:dd, dow:d.getUTCDay(), hh:d.getUTCHours(), mi:d.getUTCMinutes(),
 tanggal:`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}` };
}
function prMenit(hhmm){ const p = String(hhmm || '').split(/[:.]/).map(Number); return (p[0]||0) * 60 + (p[1]||0); }
function prLabelTanggal(tg){
 const [y, m, d] = tg.split('-').map(Number);
 const dow = new Date(y, m - 1, d).getDay();
 return `${String(d).padStart(2,'0')} ${BULAN_NAMA[m-1].slice(0,3)} · ${HARI_NAMA[dow]}`;
}

function prKonfirmasi(pesanHtml, labelOk){
 return new Promise(resolve => {
 const ov = document.createElement('div');
 ov.className = 'pr-overlay';
 ov.innerHTML = `<div class="pr-modal"><div>${pesanHtml}</div>
 <div class="pr-modal-aksi"><button type="button" class="btn-secondary" data-x="0">Batal</button>
 <button type="button" class="btn-primary" data-x="1">${prEsc(labelOk || 'Lanjutkan')}</button></div></div>`;
 document.body.appendChild(ov);
 const tutup = v => { ov.remove(); resolve(v); };
 ov.addEventListener('click', e => {
 if(e.target === ov) return tutup(false);
 const b = e.target.closest('[data-x]');
 if(b) tutup(b.dataset.x === '1');
 });
 });
}

/* ======================= GPS ======================= */
function prAmbilLokasi(){
 return new Promise((resolve, reject) => {
 if(!('geolocation' in navigator)) return reject(new Error('Browser/perangkat ini tidak mendukung GPS.'));
 const sukses = pos => resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude,
 akurasi:Math.round(pos.coords.accuracy || 0), waktu:Date.now() });
 const pesan = err => {
 if(err && err.code === 1) return 'Izin lokasi ditolak. Izinkan akses lokasi untuk situs ini di pengaturan browser, lalu tekan "Perbarui lokasi".';
 if(err && err.code === 3) return 'Waktu mendeteksi lokasi habis. Pastikan GPS aktif, lalu coba lagi.';
 return 'Lokasi tidak dapat dideteksi. Pastikan GPS/Location di HP aktif.';
 };
 navigator.geolocation.getCurrentPosition(sukses, err => {
 if(err && err.code === 1) return reject(new Error(pesan(err)));
 // coba ulang dengan akurasi normal (lebih cepat di dalam gedung)
 navigator.geolocation.getCurrentPosition(sukses, err2 => reject(new Error(pesan(err2))),
 { enableHighAccuracy:false, timeout:15000, maximumAge:60000 });
 }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
 });
}

/* ======================= FOTO SELFIE ======================= */
function prMuatGambar(src){
 return new Promise((res, rej) => {
 const img = new Image();
 img.onload = () => res(img);
 img.onerror = () => rej(new Error('File bukan gambar yang valid.'));
 img.src = src;
 });
}
// Potong tengah jadi potret 3:4 (480x640) supaya ringan & seragam
async function prPotongFoto(file){
 const url = URL.createObjectURL(file);
 try{
 const img = await prMuatGambar(url);
 const W = 480, H = 640, rasio = W / H;
 let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
 if(sw / sh > rasio){ const nw = sh * rasio; sx = (sw - nw) / 2; sw = nw; }
 else { const nh = sw / rasio; sy = (sh - nh) / 2; sh = nh; }
 const c = document.createElement('canvas');
 c.width = W; c.height = H;
 c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
 return c.toDataURL('image/jpeg', 0.85);
 } finally { URL.revokeObjectURL(url); }
}
// Tempel stempel nama, waktu & koordinat di bagian bawah foto
async function prWatermark(dataUrl, baris){
 const img = await prMuatGambar(dataUrl);
 const c = document.createElement('canvas');
 c.width = img.naturalWidth; c.height = img.naturalHeight;
 const ctx = c.getContext('2d');
 ctx.drawImage(img, 0, 0);
 const fs = Math.round(c.width / 27), lh = fs * 1.35, pad = Math.round(fs * 0.6);
 const tinggi = baris.length * lh + pad * 2;
 ctx.fillStyle = 'rgba(0,0,0,0.55)';
 ctx.fillRect(0, c.height - tinggi, c.width, tinggi);
 ctx.fillStyle = '#FFFFFF';
 ctx.textBaseline = 'top';
 baris.forEach((t, i) => {
 ctx.font = (i === 0 ? 'bold ' : '') + fs + 'px Arial, sans-serif';
 ctx.fillText(t, pad, c.height - tinggi + pad + i * lh, c.width - pad * 2);
 });
 return c.toDataURL('image/jpeg', 0.8);
}

/* ======================= HALAMAN ABSENSI / PRESENSI ======================= */
async function renderAbsensi(container){
 const p = currentPerson();
 if(!p) return;
 PR_STATE.container = container;
 PR_STATE.fotoAsli = null;
 PR_STATE.lokasi = null;
 PR_STATE.sedangKirim = false;

 const wrap = document.createElement('div');
 wrap.innerHTML = `
 <div class="view-title">
 <div class="badge-ico">🆔</div>
 <div><h2>Absensi / Presensi Digital</h2><p id="pr-subjudul">Memuat…</p></div>
 </div>
 <div id="pr-isi"><div class="card"><div class="empty">Memuat data presensi…</div></div></div>`;
 container.appendChild(wrap);

 let res;
 try{ res = await prCallServer('apiPresensiHariIni', p.id); }
 catch(e){ res = { ok:false, error:e.message }; }
 const isi = wrap.querySelector('#pr-isi');
 if(!res || !res.ok){
 isi.innerHTML = `<div class="card"><div class="empty" style="color:var(--libur,#D0463C)">Gagal memuat presensi: ${prEsc(res && res.error)}.<br>Pastikan file <b>Presensi.gs</b> sudah ditambahkan dan Web App sudah di-deploy ulang (versi baru).</div></div>`;
 return;
 }
 PR_STATE.data = res;
 PR_STATE.offsetMs = (res.waktuServerMs || Date.now()) - Date.now();
 wrap.querySelector('#pr-subjudul').innerHTML = `${prEsc(res.hariIni.label)} &middot; ${prEsc(p.nama)}`;
 prGambarHalaman(isi, p);
}

function prMuatUlangAbsensi(){
 const c = PR_STATE.container;
 if(!c) return;
 c.innerHTML = '';
 renderAbsensi(c);
}

function prAksiBerikut(rec){
 if(rec && rec.status !== 'HADIR') return 'izin';
 if(!rec || (!rec.masuk && !rec.pulang)) return 'masuk';
 if(rec.masuk && !rec.pulang) return 'pulang';
 return 'selesai';
}

function prBadgeLokasi(x){
 const link = prMapsUrl(x.lat, x.lng);
 return x.diLuar
 ? `<a class="pr-badge warn" href="${link}" target="_blank" rel="noopener">⚠️ Di luar lokasi kantor · ${prFormatJarak(x.jarak)}</a>`
 : `<a class="pr-badge ok" href="${link}" target="_blank" rel="noopener">✅ Di kantor · ${prFormatJarak(x.jarak)}</a>`;
}

function prTileHtml(judul, x, flag){
 if(!x){
 return `<div class="pr-tile"><div class="pr-thumb">⏳</div><div><div class="pr-label">${judul}</div><div class="pr-jam pr-muted">Belum</div></div></div>`;
 }
 return `<div class="pr-tile">
 <a href="${prEsc(x.fotoUrl)}" target="_blank" rel="noopener"><img class="pr-thumb" src="${prEsc(x.fotoUrl)}" alt="Selfie"></a>
 <div><div class="pr-label">${judul}</div>
 <div class="pr-jam">${prEsc(String(x.jam).slice(0,5))} <small>WIB</small></div>
 <div class="pr-badges">${prBadgeLokasi(x)}${flag ? ` <span class="pr-badge bad">${prEsc(flag)}</span>` : ''}</div></div>
 </div>`;
}

function prGambarHalaman(isi, p){
 const d = PR_STATE.data, rec = d.record;
 const aksi = prAksiBerikut(rec);
 let atas;
 if(aksi === 'izin'){
 atas = `<div class="card">
 <div class="pr-label">Status kehadiran hari ini</div>
 <div class="pr-jam">${prEsc(rec.status)}</div>
 <div class="pr-muted" style="margin:4px 0 12px;">${prEsc(rec.keterangan || '')}</div>
 <button type="button" class="btn-secondary pr-kecil" id="pr-btn-batal-izin">Batalkan keterangan ini</button>
 </div>`;
 } else {
 atas = `<div class="pr-grid">
 ${prTileHtml('☀️ Absen Masuk', rec && rec.masuk, rec && rec.terlambat ? 'Terlambat' : '')}
 ${prTileHtml('🌙 Absen Pulang', rec && rec.pulang, rec && rec.pulangCepat ? 'Pulang cepat' : '')}
 </div>`;
 }
 isi.innerHTML = `
 ${d.hariIni.libur ? `<div class="pr-alert">📅 Hari ini ${prEsc(d.hariIni.libur)}. Presensi tetap bisa diisi bila Anda bertugas.</div>` : ''}
 ${atas}
 <div id="pr-aksi"></div>
 <div class="card"><h3 class="pr-h3">🗓️ Riwayat Presensi Bulan Ini</h3><div id="pr-riwayat-isi"><div class="empty">Memuat…</div></div></div>`;

 const aksiEl = isi.querySelector('#pr-aksi');
 if(aksi === 'masuk' || aksi === 'pulang') prFormAbsen(aksiEl, p, aksi);
 else if(aksi === 'selesai') aksiEl.innerHTML = `<div class="card pr-selesai">✅ <b>Presensi hari ini sudah lengkap.</b> Terima kasih!</div>`;

 const batal = isi.querySelector('#pr-btn-batal-izin');
 if(batal) batal.addEventListener('click', async () => {
 const ok = await prKonfirmasi('Batalkan keterangan <b>' + prEsc(rec.status) + '</b> hari ini? Setelah itu Anda bisa absen seperti biasa.', 'Ya, batalkan');
 if(!ok) return;
 try{
 const r = await prCallServer('apiPresensiBatalIzin', p.id);
 if(!r.ok) throw new Error(r.error);
 showToast('Keterangan dibatalkan');
 prMuatUlangAbsensi();
 }catch(e){ showToast('Gagal: ' + e.message); }
 });

 prMuatRiwayat(isi.querySelector('#pr-riwayat-isi'), p);
}

function prFormAbsen(el, p, tipe){
 const cfg = PR_STATE.data.config, rec = PR_STATE.data.record;
 PR_STATE.fotoAsli = null;
 const label = tipe === 'masuk' ? 'Absen Masuk' : 'Absen Pulang';
 const bolehLangsungPulang = tipe === 'masuk' && prWIB().hh >= 12;
 const tanpaMasuk = tipe === 'pulang' && !(rec && rec.masuk);

 el.innerHTML = `
 <div class="card">
 <h3 class="pr-h3">${tipe === 'masuk' ? '☀️' : '🌙'} ${label}${tanpaMasuk ? ' <span class="pr-badge bad">tanpa absen masuk</span>' : ''}</h3>
 <div class="pr-langkah">
 <div class="pr-no">1</div>
 <div class="pr-langkah-isi">
 <div class="pr-langkah-judul">Lokasi GPS</div>
 <div id="pr-lokasi" class="pr-lokasi">📡 Mendeteksi lokasi…</div>
 <button type="button" class="btn-secondary pr-kecil" id="pr-btn-lokasi">🔄 Perbarui lokasi</button>
 </div>
 </div>
 <div class="pr-langkah" style="border-bottom:none;">
 <div class="pr-no">2</div>
 <div class="pr-langkah-isi">
 <div class="pr-langkah-judul">Foto Selfie</div>
 <label class="pr-kamera"><input type="file" accept="image/*" capture="user" id="pr-foto"><span id="pr-teks-kamera">📷 Ambil Foto Selfie</span></label>
 <div id="pr-foto-preview"></div>
 </div>
 </div>
 <button type="button" class="btn-primary pr-tombol-besar" id="pr-btn-kirim" disabled>${label} Sekarang</button>
 <div class="pr-info-siap" id="pr-info-siap"></div>
 <p class="pr-catatan">Jam absen dicatat otomatis oleh server (WIB), bukan dari jam HP. Radius kantor ${cfg.radiusMeter} m.</p>
 ${bolehLangsungPulang ? `<div style="text-align:center;"><button type="button" class="pr-link-btn" id="pr-btn-langsung-pulang">Lupa absen masuk? Langsung absen pulang</button></div>` : ''}
 </div>
 ${tipe === 'masuk' ? `
 <details class="card pr-izin">
 <summary>🙋 Tidak bisa hadir hari ini? Ajukan Izin / Sakit / Cuti / Dinas Luar</summary>
 <div class="pr-izin-isi">
 <div class="field"><label>Jenis</label>
 <select id="pr-izin-jenis"><option>IZIN</option><option>SAKIT</option><option>CUTI</option><option>DINAS LUAR</option></select></div>
 <div class="field" style="flex:1; min-width:220px;"><label>Keterangan</label>
 <textarea id="pr-izin-ket" rows="2" placeholder="Contoh: Sakit demam, surat dokter menyusul / Dinas ke Medan"></textarea></div>
 <button type="button" class="btn-secondary" id="pr-btn-izin">Kirim Keterangan</button>
 </div>
 </details>` : ''}`;

 el.querySelector('#pr-btn-lokasi').addEventListener('click', () => prPerbaruiLokasi(el));

 el.querySelector('#pr-foto').addEventListener('change', async e => {
 const f = e.target.files && e.target.files[0];
 if(!f) return;
 const prev = el.querySelector('#pr-foto-preview');
 prev.innerHTML = '<div class="pr-kecil-teks pr-muted">Memproses foto…</div>';
 try{
 // tolak foto lama dari galeri: foto harus diambil langsung (maks. 15 menit lalu)
 if(f.lastModified && Date.now() - f.lastModified > 15 * 60 * 1000){
 throw new Error('Foto harus diambil langsung dari kamera saat ini, bukan foto lama dari galeri.');
 }
 PR_STATE.fotoAsli = await prPotongFoto(f);
 prev.innerHTML = `<img src="${PR_STATE.fotoAsli}" class="pr-preview" alt="Selfie">`;
 el.querySelector('#pr-teks-kamera').textContent = '📷 Ulangi Foto';
 }catch(err){
 PR_STATE.fotoAsli = null;
 prev.innerHTML = `<div class="pr-lokasi bad">❌ ${prEsc(err.message)}</div>`;
 }
 e.target.value = '';
 prCekSiap(el);
 });

 el.querySelector('#pr-btn-kirim').addEventListener('click', () => prKirimAbsen(el, p, tipe));

 const langsung = el.querySelector('#pr-btn-langsung-pulang');
 if(langsung) langsung.addEventListener('click', () => prFormAbsen(el, p, 'pulang'));

 const izinBtn = el.querySelector('#pr-btn-izin');
 if(izinBtn) izinBtn.addEventListener('click', async () => {
 const jenis = el.querySelector('#pr-izin-jenis').value;
 const ket = el.querySelector('#pr-izin-ket').value.trim();
 if(!ket){ showToast('Tuliskan keterangan singkat'); return; }
 const ok = await prKonfirmasi(`Catat hari ini sebagai <b>${prEsc(jenis)}</b>?<br><span class="pr-muted">${prEsc(ket)}</span>`, 'Ya, kirim');
 if(!ok) return;
 izinBtn.disabled = true;
 try{
 const r = await prCallServer('apiPresensiIzin', p.id, jenis, ket);
 if(!r.ok) throw new Error(r.error);
 showToast('Keterangan ' + jenis + ' tersimpan');
 prMuatUlangAbsensi();
 }catch(err){ showToast('Gagal: ' + err.message); izinBtn.disabled = false; }
 });

 prCekSiap(el);
 prPerbaruiLokasi(el);
}

async function prPerbaruiLokasi(el){
 const box = el.querySelector('#pr-lokasi');
 if(!box) return;
 const cfg = PR_STATE.data.config;
 PR_STATE.lokasi = null;
 prCekSiap(el);
 box.className = 'pr-lokasi';
 box.innerHTML = '📡 Mendeteksi lokasi… (pastikan GPS aktif & izinkan akses lokasi)';
 try{
 const lok = await prAmbilLokasi();
 lok.jarak = Math.round(prJarak(lok.lat, lok.lng, cfg.kantorLat, cfg.kantorLng));
 lok.diLuar = lok.jarak > cfg.radiusMeter;
 if(!box.isConnected) return;
 PR_STATE.lokasi = lok;
 box.className = 'pr-lokasi ' + (lok.diLuar ? 'warn' : 'ok');
 box.innerHTML = (lok.diLuar
 ? `⚠️ <b>Di luar lokasi kantor</b> — ${prFormatJarak(lok.jarak)} dari kantor (batas ${cfg.radiusMeter} m). Anda tetap bisa absen, tetapi akan ditandai untuk dicek Team Leader.`
 : `✅ <b>Anda berada di area kantor</b> — ${prFormatJarak(lok.jarak)} dari titik kantor.`)
 + `<div class="pr-kecil-teks">Akurasi GPS ±${lok.akurasi} m · <a href="${prMapsUrl(lok.lat, lok.lng)}" target="_blank" rel="noopener">Lihat di peta</a></div>`
 + (lok.akurasi > 150 ? `<div class="pr-kecil-teks">Akurasi masih rendah. Coba dekat jendela / area terbuka lalu tekan "Perbarui lokasi".</div>` : '');
 }catch(e){
 if(!box.isConnected) return;
 box.className = 'pr-lokasi bad';
 box.innerHTML = `❌ ${prEsc(e.message)}`;
 }
 prCekSiap(el);
}

function prCekSiap(el){
 const btn = el.querySelector('#pr-btn-kirim');
 if(!btn) return;
 const kurang = [];
 if(!PR_STATE.lokasi) kurang.push('lokasi GPS');
 if(!PR_STATE.fotoAsli) kurang.push('foto selfie');
 btn.disabled = kurang.length > 0 || PR_STATE.sedangKirim;
 const info = el.querySelector('#pr-info-siap');
 if(info) info.textContent = PR_STATE.sedangKirim ? '' : (kurang.length ? 'Lengkapi dulu: ' + kurang.join(' & ') : 'Siap dikirim');
}

async function prKirimAbsen(el, p, tipe){
 if(PR_STATE.sedangKirim || !PR_STATE.lokasi || !PR_STATE.fotoAsli) return;
 const cfg = PR_STATE.data.config, rec = PR_STATE.data.record;

 // lokasi lebih dari 5 menit -> ambil ulang supaya akurat
 if(Date.now() - PR_STATE.lokasi.waktu > 5 * 60 * 1000){
 showToast('Memperbarui lokasi…');
 await prPerbaruiLokasi(el);
 if(!PR_STATE.lokasi) return;
 }
 const L = PR_STATE.lokasi;
 const w = prWIB();

 const peringatan = [];
 if(L.diLuar) peringatan.push(`Anda berada <b>${prFormatJarak(L.jarak)}</b> dari kantor (di luar radius ${cfg.radiusMeter} m). Absen akan ditandai <b>⚠️ Di luar lokasi kantor</b>.`);
 if(tipe === 'pulang' && !(rec && rec.masuk)) peringatan.push('Anda <b>belum absen masuk</b> hari ini. Absen pulang tetap dicatat dengan catatan "Tidak absen masuk".');
 if(tipe === 'pulang' && !PR_STATE.data.hariIni.akhirPekan && (w.hh * 60 + w.mi) < prMenit(cfg.jamPulang)) peringatan.push(`Sekarang belum jam pulang (${cfg.jamPulang} WIB). Absen akan ditandai <b>Pulang cepat</b>.`);
 if(peringatan.length){
 const ok = await prKonfirmasi('<b>Perhatian:</b><ul>' + peringatan.map(t => `<li>${t}</li>`).join('') + '</ul><p style="margin:12px 0 0;">Tetap lanjutkan absen?</p>', 'Ya, tetap absen');
 if(!ok) return;
 }

 PR_STATE.sedangKirim = true;
 prCekSiap(el);
 const btn = el.querySelector('#pr-btn-kirim');
 const labelAsli = btn.textContent;
 btn.textContent = '⏳ Mengirim presensi…';
 try{
 const foto = await prWatermark(PR_STATE.fotoAsli, [
 `${p.nama} · ABSEN ${tipe.toUpperCase()}`,
 `${HARI_NAMA[w.dow]}, ${w.d} ${BULAN_NAMA[w.m-1]} ${w.y} · ${pad2(w.hh)}:${pad2(w.mi)} WIB`,
 `${L.lat.toFixed(6)}, ${L.lng.toFixed(6)} (±${L.akurasi} m)`,
 `${prFormatJarak(L.jarak)} dari kantor${L.diLuar ? ' · DI LUAR RADIUS' : ''}`,
 ]);
 const res = await prCallServer('apiPresensiAbsen', p.id, tipe, {
 lat:L.lat, lng:L.lng, akurasi:L.akurasi, foto, perangkat:navigator.userAgent
 });
 if(!res || !res.ok) throw new Error((res && res.error) || 'Gagal menyimpan presensi');
 const bag = res.record[tipe];
 showToast(`✅ ${label(tipe)} tercatat pukul ${bag ? String(bag.jam).slice(0,5) : ''} WIB`);
 PR_STATE.sedangKirim = false;
 prMuatUlangAbsensi();
 }catch(e){
 PR_STATE.sedangKirim = false;
 btn.textContent = labelAsli;
 prCekSiap(el);
 showToast('Gagal: ' + e.message);
 }
 function label(t){ return t === 'masuk' ? 'Absen masuk' : 'Absen pulang'; }
}

/* ---------- Tampilan sel & catatan (dipakai riwayat & tampilan tim) ---------- */
function prSelJam(x){
 if(!x) return '<span class="pr-muted">—</span>';
 return `<div class="pr-sel">
 ${x.fotoUrl ? `<a href="${prEsc(x.fotoUrl)}" target="_blank" rel="noopener"><img class="pr-mini" src="${prEsc(x.fotoUrl)}" alt="" loading="lazy"></a>` : ''}
 <div><b>${prEsc(String(x.jam).slice(0,5))}</b><br>
 <a class="pr-kecil-teks ${x.diLuar ? 'pr-teks-warn' : 'pr-teks-ok'}" href="${prMapsUrl(x.lat, x.lng)}" target="_blank" rel="noopener">${x.diLuar ? '⚠️ ' : '📍 '}${prFormatJarak(x.jarak)}</a></div>
 </div>`;
}
function prFlagsHtml(r, lampau){
 const b = [];
 if(r.masuk && r.masuk.diLuar) b.push('<span class="pr-badge warn">⚠️ Masuk di luar lokasi kantor</span>');
 if(r.pulang && r.pulang.diLuar) b.push('<span class="pr-badge warn">⚠️ Pulang di luar lokasi kantor</span>');
 if(r.terlambat) b.push('<span class="pr-badge bad">Terlambat</span>');
 if(r.pulangCepat) b.push('<span class="pr-badge warn">Pulang cepat</span>');
 if(r.masuk && !r.pulang && lampau) b.push('<span class="pr-badge bad">Tidak absen pulang</span>');
 if(!r.masuk && r.pulang) b.push('<span class="pr-badge bad">Tidak absen masuk</span>');
 if(b.length) return `<div class="pr-badges" style="margin:0;">${b.join('')}</div>`;
 return (r.masuk && r.pulang) ? '<span class="pr-badge ok">✓ Sesuai</span>' : '<span class="pr-muted">—</span>';
}

async function prMuatRiwayat(box, p){
 const [y, m] = PR_STATE.data.hariIni.tanggal.split('-').map(Number);
 let res;
 try{ res = await prCallServer('apiPresensiBulan', p.id, y, m); }
 catch(e){ res = { ok:false, error:e.message }; }
 if(!box || !box.isConnected) return;
 if(!res || !res.ok){ box.innerHTML = `<div class="empty">Gagal memuat riwayat: ${prEsc(res && res.error)}</div>`; return; }
 const list = res.data || [];
 if(!list.length){ box.innerHTML = '<div class="empty">Belum ada data presensi bulan ini.</div>'; return; }
 box.innerHTML = `<div class="pr-scroll"><table class="pr-tabel">
 <thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Catatan</th></tr></thead>
 <tbody>${list.map(r => r.status !== 'HADIR'
 ? `<tr><td data-label="Tanggal">${prLabelTanggal(r.tanggal)}</td><td colspan="2" data-label="Status"><span class="pr-badge info">${prEsc(r.status)}</span></td><td data-label="Keterangan">${prEsc(r.keterangan)}</td></tr>`
 : `<tr><td data-label="Tanggal">${prLabelTanggal(r.tanggal)}</td><td data-label="Masuk">${prSelJam(r.masuk)}</td><td data-label="Pulang">${prSelJam(r.pulang)}</td><td data-label="Catatan">${prFlagsHtml(r, r.tanggal < res.hariIni)}</td></tr>`
 ).join('')}</tbody></table></div>`;
}

/* ======================= PANEL TEAM LEADER (di tab Laporan Tim) ======================= */
// Fungsi global khusus modul Presensi. renderRekapPresensiTim berada di luar IIFE
// modul export laporan, jadi tidak boleh bergantung pada fungsi lokal IIFE tersebut.
function prMingguDalamBulan_(y, m){
 const n = new Date(y, m, 0).getDate(), out = [];
 let cur = [];
 for(let d = 1; d <= n; d++){
  cur.push(d);
  if(new Date(y, m - 1, d).getDay() === 0 || d === n){
   out.push(cur);
   cur = [];
  }
 }
 return out;
}
async function renderRekapPresensiTim(container){
 const p = currentPerson();
 if(!p || !p.isLead) return;
 const el = document.createElement('div');
 el.className = 'card';
 const anchor = container.querySelector('#detail-area');
 if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(el, anchor);
 else container.appendChild(el);

 const w = prWIB(Date.now());
 const bulanOpt = BULAN_NAMA.map((b, i) => `<option value="${i+1}" ${i+1 === w.m ? 'selected' : ''}>${b}</option>`).join('');
 let tahunOpt = '';
 for(let y = w.y - 1; y <= w.y + 1; y++) tahunOpt += `<option value="${y}" ${y === w.y ? 'selected' : ''}>${y}</option>`;

 el.innerHTML = `
 <div class="pr-tim-head">
 <h3 class="pr-h3" style="margin:0;">🆔 Presensi Tim</h3>
 <div class="pr-tim-kontrol">
 <input type="date" id="pr-tim-tgl" value="${w.tanggal}">
 <button type="button" class="btn-secondary pr-kecil" id="pr-tim-muat">🔄 Muat ulang</button>
 </div>
 </div>
 <div class="pr-kecil-teks pr-muted" id="pr-tim-info" style="margin-bottom:12px;"></div>
 <div id="pr-tim-harian"><div class="empty">Memuat…</div></div>
 <h3 class="pr-h3" style="margin-top:22px;">📊 Rekap Bulan <span id="pr-tim-bulan"></span></h3>
 <div id="pr-tim-rekap"></div>
 <div class="pr-export">
 <div class="pr-langkah-judul">📥 Export Daftar Hadir (Excel)</div>
 <div class="pr-export-kontrol">
 <select id="pr-exp-bulan" title="Bulan">${bulanOpt}</select>
 <select id="pr-exp-tahun" title="Tahun">${tahunOpt}</select>
 <select id="pr-exp-minggu" title="Periode"></select>
 <label style="display:flex; align-items:center; gap:6px; font-size:13.5px;"><input type="checkbox" id="pr-exp-foto" checked> Sertakan lampiran foto selfie</label>
 <label style="display:flex; align-items:center; gap:6px; font-size:13.5px;"><input type="checkbox" id="pr-exp-ttd" checked> Bubuhkan tanda tangan</label>
 <button type="button" class="btn-primary" id="pr-exp-btn">Buat Daftar Hadir</button>
 </div>
 <div class="pr-kecil-teks pr-muted" style="margin-top:7px;">Periode dapat dipilih <b>satu bulan penuh</b> atau <b>mingguan</b>. Tanda tangan dapat dibubuhkan atau dihilangkan sesuai kebutuhan.</div>
 <div id="pr-exp-hasil" class="pr-kecil-teks" style="margin-top:10px;"></div>
 </div>`;

 const muat = async () => {
 const tgl = el.querySelector('#pr-tim-tgl').value;
 const harianEl = el.querySelector('#pr-tim-harian'), rekapEl = el.querySelector('#pr-tim-rekap');
 harianEl.innerHTML = '<div class="empty">Memuat…</div>';
 rekapEl.innerHTML = '';
 let res;
 try{ res = await prCallServer('apiPresensiTim', p.id, tgl); }
 catch(e){ res = { ok:false, error:e.message }; }
 if(!res || !res.ok){ harianEl.innerHTML = `<div class="empty">Gagal memuat presensi tim: ${prEsc(res && res.error)}</div>`; return; }
 const lampau = res.tanggal < res.hariIni;
 el.querySelector('#pr-tim-info').innerHTML = prEsc(res.info.label) + (res.info.libur ? ` · <span class="pr-badge info">${prEsc(res.info.libur)}</span>` : '');
 el.querySelector('#pr-tim-bulan').textContent = res.bulanLabel;
 const orang = h => `<div class="pr-orang">${typeof avatarHtml === 'function' ? avatarHtml(h) : ''}<div><b>${prEsc(h.nama)}</b><div class="pr-kecil-teks pr-muted" style="margin:0;">${prEsc(h.jabatan)}</div></div></div>`;

 harianEl.innerHTML = `<div class="pr-scroll"><table class="pr-tabel">
 <thead><tr><th>Anggota</th><th>Masuk</th><th>Pulang</th><th>Catatan</th></tr></thead>
 <tbody>${res.harian.map(h => {
 const r = h.record;
 if(!r) return `<tr><td data-label="Anggota">${orang(h)}</td><td colspan="2" data-label="Status"><span class="pr-badge ${lampau ? 'bad' : 'info'}">${lampau ? 'Tidak absen' : 'Belum absen'}</span></td><td data-label="Catatan">—</td></tr>`;
 if(r.status !== 'HADIR') return `<tr><td data-label="Anggota">${orang(h)}</td><td colspan="2" data-label="Status"><span class="pr-badge info">${prEsc(r.status)}</span></td><td data-label="Keterangan">${prEsc(r.keterangan)}</td></tr>`;
 return `<tr><td data-label="Anggota">${orang(h)}</td><td data-label="Masuk">${prSelJam(r.masuk)}</td><td data-label="Pulang">${prSelJam(r.pulang)}</td><td data-label="Catatan">${prFlagsHtml(r, lampau)}</td></tr>`;
 }).join('')}</tbody></table></div>`;

 const angka = (n, kelas) => n > 0 ? `<span class="${kelas}">${n}</span>` : '0';
 rekapEl.innerHTML = `<div class="pr-scroll"><table class="pr-tabel">
 <thead><tr><th>Anggota</th><th>Hadir</th><th>Izin/Sakit/Cuti/DL</th><th>Tidak Absen</th><th>Terlambat</th><th>⚠️ Luar Lokasi</th><th>Tanpa Absen Pulang</th></tr></thead>
 <tbody>${res.rekap.map(k => `<tr>
 <td data-label="Anggota"><b>${prEsc(k.nama)}</b></td>
 <td data-label="Hadir"><b>${k.hadir}</b> <span class="pr-kecil-teks pr-muted">/ ${k.hariKerja} hari kerja</span></td>
 <td data-label="Izin/Sakit/Cuti/DL">${k.izin}</td>
 <td data-label="Tidak Absen">${angka(k.tidakAbsen, 'pr-angka-bad')}</td>
 <td data-label="Terlambat">${angka(k.terlambat, 'pr-angka-warn')}</td>
 <td data-label="Di Luar Lokasi">${angka(k.luarLokasi, 'pr-angka-warn')}</td>
 <td data-label="Tanpa Absen Pulang">${angka(k.tanpaPulang, 'pr-angka-warn')}</td>
 </tr>`).join('')}</tbody></table></div>
 <div class="pr-kecil-teks pr-muted">Hari kerja dihitung sampai kemarin (tanpa Sabtu, Minggu & tanggal di sheet HariLibur).</div>`;
 };

 el.querySelector('#pr-tim-tgl').addEventListener('change', muat);
 el.querySelector('#pr-tim-muat').addEventListener('click', muat);

 const expBulan = el.querySelector('#pr-exp-bulan'), expTahun = el.querySelector('#pr-exp-tahun'), expMinggu = el.querySelector('#pr-exp-minggu');
 const isiPeriodeExport = () => {
   const y=+expTahun.value, m=+expBulan.value, ww=prMingguDalamBulan_(y,m), bl=BULAN_NAMA[m-1];
   expMinggu.innerHTML = `<option value="0">Satu bulan penuh (${ww.length} minggu)</option>` + ww.map((h,i)=>`<option value="${i+1}">Minggu ke-${i+1} (${h[0]}${h.length>1?'–'+h[h.length-1]:''} ${bl})</option>`).join('');
 };
 expBulan.addEventListener('change',isiPeriodeExport); expTahun.addEventListener('change',isiPeriodeExport); isiPeriodeExport();
 const expBtn = el.querySelector('#pr-exp-btn');
 expBtn.addEventListener('click', async () => {
 const y = +expTahun.value, m = +expBulan.value, minggu=+expMinggu.value;
 const foto = el.querySelector('#pr-exp-foto').checked, ttd = el.querySelector('#pr-exp-ttd').checked;
 const hasil = el.querySelector('#pr-exp-hasil');
 expBtn.disabled = true;
 hasil.innerHTML = '⏳ Sedang membuat file Daftar Hadir… Mohon tunggu' + (foto ? ' (bisa 1–4 menit karena menyertakan foto).' : '.');
 try{
 const r = await prCallServer('apiExportDaftarHadir', p.id, y, m, foto, minggu, ttd);
 if(!r || !r.ok) throw new Error((r && r.error) || 'Gagal membuat file');
 hasil.innerHTML = `✅ Berhasil: <b>${prEsc(r.namaFile)}</b><br>
 <a href="${prEsc(r.url)}" target="_blank" rel="noopener">Buka di Google Sheets</a> &middot;
 <a href="${prEsc(r.xlsxUrl)}" target="_blank" rel="noopener">Download Excel (.xlsx)</a><br>
 <span class="pr-muted">${prEsc(r.pesan)}</span>`;
 }catch(e){
 hasil.innerHTML = `<span style="color:var(--libur,#D0463C)">Gagal: ${prEsc(e.message)}</span>`;
 }
 expBtn.disabled = false;
 });

 await muat();
}
</script>

 function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 }

 async function exPost(action, payload){
  if(typeof WEB_APP_URL === 'undefined' || String(WEB_APP_URL).indexOf('https://') !== 0) throw new Error('WEB_APP_URL belum diisi.');
  let res;
  try{
   res = await fetch(WEB_APP_URL, {
    method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload))
   });
  }catch(e){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); }
  const teks = await res.text();
  let data;
  try{ data = JSON.parse(teks); }
  catch(e){ throw new Error('Respons server tidak valid. Pastikan Code.gs terbaru sudah di-deploy (versi baru).'); }
  if(!data.ok) throw new Error(data.error || 'Gagal');
  return data;
 }

 /* ---------- Periode: bulan, tahun, minggu ke-n (Senin s/d Minggu, sama seperti backend) ---------- */
 function mingguDalamBulan(y, m){
  const n = new Date(y, m, 0).getDate(), out = [];
  let cur = [];
  for(let d = 1; d <= n; d++){
   cur.push(d);
   if(new Date(y, m - 1, d).getDay() === 0 || d === n){ out.push(cur); cur = []; }
  }
  return out;
 }
 function pasangPeriode(root, y0, m0){
  const sb = root.querySelector('[data-f="bulan"]'), st = root.querySelector('[data-f="tahun"]'), sm = root.querySelector('[data-f="minggu"]');
  sb.innerHTML = BULAN_NAMA.map((b, i) => `<option value="${i+1}" ${i+1 === m0 ? 'selected' : ''}>${b}</option>`).join('');
  const ty = new Date().getFullYear();
  let t = '';
  for(let y = ty - 1; y <= ty + 1; y++) t += `<option value="${y}" ${y === y0 ? 'selected' : ''}>${y}</option>`;
  st.innerHTML = t;
  const isi = () => {
   const y = +st.value, m = +sb.value, w = mingguDalamBulan(y, m), bl = BULAN_NAMA[m-1];
   sm.innerHTML = `<option value="0">Satu bulan penuh (${w.length} minggu)</option>` +
    w.map((h, i) => `<option value="${i+1}">Minggu ke-${i+1} (${h[0]}${h.length > 1 ? '–' + h[h.length-1] : ''} ${bl})</option>`).join('');
  };
  sb.addEventListener('change', isi);
  st.addEventListener('change', isi);
  isi();
  return () => ({ year:+st.value, month:+sb.value, minggu:+sm.value });
 }
 function hasilHtml(r){
  return `✅ Berhasil: <b>${esc(r.namaFile)}</b><br>
   <a href="${esc(r.url)}" target="_blank" rel="noopener">Buka di Google Sheets</a> &middot;
   <a href="${esc(r.xlsxUrl)}" target="_blank" rel="noopener">Download Excel (.xlsx)</a>
   ${r.pesan ? `<br><span style="color:var(--ink-soft)">${esc(r.pesan)}</span>` : ''}`;
 }

 /* ======================= TANDA TANGAN: pad gambar & unggah ======================= */
 function muatGambar(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('File bukan gambar yang valid.')); i.src = src; });
 }
 // Potong area kosong lalu pusatkan ke kanvas 600x240 PNG transparan (rasio 5:2)
 function rapikanTtd(cv){
  const w = cv.width, h = cv.height;
  const d = cv.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
   if(d[(y * w + x) * 4 + 3] > 20){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  }
  if(x1 < 0) return null;
  const sw = x1 - x0 + 1, sh = y1 - y0 + 1, W = 600, H = 240, pad = 12;
  const s = Math.min((W - 2 * pad) / sw, (H - 2 * pad) / sh);
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.imageSmoothingQuality = 'high';
  o.drawImage(cv, x0, y0, sw, sh, (W - sw * s) / 2, (H - sh * s) / 2, sw * s, sh * s);
  return out.toDataURL('image/png');
 }
 // Foto/scan tanda tangan di kertas putih -> latar putih dibuat transparan
 async function ttdDariFile(file){
  const url = URL.createObjectURL(file);
  try{
   const img = await muatGambar(url);
   const sk = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
   const cv = document.createElement('canvas');
   cv.width = Math.round(img.naturalWidth * sk); cv.height = Math.round(img.naturalHeight * sk);
   const c = cv.getContext('2d');
   c.drawImage(img, 0, 0, cv.width, cv.height);
   const id = c.getImageData(0, 0, cv.width, cv.height), d = id.data;
   for(let i = 0; i < d.length; i += 4){
    const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    if(lum >= 215) d[i+3] = 0;
    else if(lum > 150) d[i+3] = Math.round(d[i+3] * (215 - lum) / 65);
   }
   c.putImageData(id, 0, 0);
   return rapikanTtd(cv);
  } finally { URL.revokeObjectURL(url); }
 }
 function bukaPadTtd(judul){
  return new Promise(resolve => {
   const ov = document.createElement('div');
   ov.className = 'pr-overlay';
   ov.innerHTML = `<div class="pr-modal" style="width:620px;">
     <h3 class="pr-h3">✍️ ${esc(judul)}</h3>
     <p class="pr-kecil-teks pr-muted" style="margin:0 0 10px;">Tanda tangani di dalam kotak memakai jari (HP/tablet) atau mouse.</p>
     <canvas class="ttd-pad"></canvas>
     <div class="pr-modal-aksi">
      <button type="button" class="btn-secondary" data-a="ulang">Ulangi</button>
      <button type="button" class="btn-secondary" data-a="batal">Batal</button>
      <button type="button" class="btn-primary" data-a="simpan">Simpan</button>
     </div></div>`;
   document.body.appendChild(ov);
   const cv = ov.querySelector('canvas');
   const dpr = window.devicePixelRatio || 1;
   const rect = cv.getBoundingClientRect();
   cv.width = Math.round(rect.width * dpr); cv.height = Math.round(rect.height * dpr);
   const ctx = cv.getContext('2d');
   ctx.lineCap = 'round'; ctx.lineJoin = 'round';
   ctx.strokeStyle = ctx.fillStyle = '#0B1F5C'; // tinta biru tua
   ctx.lineWidth = 2.8 * dpr;
   let menggambar = false, ada = false, akhir = null;
   const titik = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * dpr, y:(e.clientY - r.top) * dpr }; };
   cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    menggambar = true; ada = true; akhir = titik(e);
    ctx.beginPath(); ctx.arc(akhir.x, akhir.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
   });
   cv.addEventListener('pointermove', e => {
    if(!menggambar) return;
    e.preventDefault();
    const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    pts.forEach(ev => {
     const t = titik(ev);
     ctx.beginPath(); ctx.moveTo(akhir.x, akhir.y); ctx.lineTo(t.x, t.y); ctx.stroke();
     akhir = t;
    });
   });
   const berhenti = () => { menggambar = false; };
   cv.addEventListener('pointerup', berhenti);
   cv.addEventListener('pointercancel', berhenti);
   const tutup = v => { ov.remove(); resolve(v); };
   ov.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if(!b) return;
    if(b.dataset.a === 'ulang'){ ctx.clearRect(0, 0, cv.width, cv.height); ada = false; }
    if(b.dataset.a === 'batal') tutup(null);
    if(b.dataset.a === 'simpan'){
     if(!ada){ showToast('Kotak tanda tangan masih kosong'); return; }
     tutup(rapikanTtd(cv));
    }
   });
  });
 }

 /* ======================= KARTU: TANDA TANGAN DIGITAL (Pengaturan) ======================= */
 function kartuTandaTangan(container){
  const p = currentPerson();
  if(!p) return;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
   <h3 style="font-size:15px; margin-bottom:6px;">✍️ Tanda Tangan Digital</h3>
   <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;">
    Dibubuhkan otomatis di kolom "Dibuat Oleh" / "Diketahui Oleh" pada file laporan kerja dan daftar hadir. File disimpan privat di Database.
    ${p.isLead ? 'Sebagai Team Leader, Anda juga bisa mengatur tanda tangan pejabat penanda tangan. Gunakan hanya dengan izin yang bersangkutan.' : ''}
   </p>
   <div data-f="isi"></div>`;
  container.appendChild(card);
  const isi = card.querySelector('[data-f="isi"]');
  let pin = '';

  const formPin = (pesanError) => {
   isi.innerHTML = `
    <div class="ex-kontrol">
     <input type="password" inputmode="numeric" data-f="pin" placeholder="PIN Anda" style="width:160px;">
     <button type="button" class="btn-primary" data-f="buka">Tampilkan tanda tangan</button>
    </div>
    <div class="ex-info" style="${pesanError ? 'color:var(--libur)' : ''}">${pesanError ? esc(pesanError) : 'Masukkan PIN untuk melihat dan mengubah tanda tangan.'}</div>`;
   const inp = isi.querySelector('[data-f="pin"]');
   const buka = () => { const v = inp.value.trim(); if(!v){ showToast('Masukkan PIN'); return; } pin = v; muat(); };
   isi.querySelector('[data-f="buka"]').addEventListener('click', buka);
   inp.addEventListener('keydown', e => { if(e.key === 'Enter') buka(); });
  };

  const muat = async () => {
   isi.innerHTML = '<div class="empty">Memuat…</div>';
   let r;
   try{ r = await exPost('ttdlist', { personId: p.id, pin }); }
   catch(e){ pin = ''; formPin(e.message); return; }
   isi.innerHTML = '';
   r.data.forEach(t => {
    const it = document.createElement('div');
    it.className = 'ttd-item';
    it.innerHTML = `
     <div class="ttd-preview">${t.dataUrl ? `<img src="${t.dataUrl}" alt="Tanda tangan ${esc(t.nama)}">` : '<span class="pr-kecil-teks pr-muted">Belum ada</span>'}</div>
     <div style="flex:1; min-width:220px;">
      <b>${esc(t.nama)}</b>${t.milikSendiri ? ' <span class="pr-badge info">Anda</span>' : ''}
      <div class="pr-kecil-teks pr-muted">${esc(t.keterangan || '')}${t.info ? '<br>' + esc(t.info) : ''}</div>
      <div class="ex-kontrol" style="margin-top:10px;">
       <button type="button" class="btn-secondary pr-kecil" data-a="pad">✍️ Tanda tangan langsung</button>
       <label class="btn-secondary pr-kecil ex-file">📁 Unggah gambar<input type="file" accept="image/*" data-a="file"></label>
       ${t.dataUrl ? '<button type="button" class="btn-secondary pr-kecil" data-a="hapus" style="color:var(--libur)">Hapus</button>' : ''}
      </div>
     </div>`;
    const simpan = async (dataUrl) => {
     if(!dataUrl){ showToast('Tanda tangan tidak terbaca, coba lagi'); return; }
     showToast('Menyimpan tanda tangan…');
     try{
      await exPost('setttd', { personId: p.id, pin, kunci: t.kunci, ttdBase64: dataUrl });
      showToast('Tanda tangan tersimpan');
      muat();
     }catch(e){ showToast('Gagal: ' + e.message); }
    };
    it.querySelector('[data-a="pad"]').addEventListener('click', async () => {
     const d = await bukaPadTtd('Tanda tangan ' + t.nama);
     if(d) simpan(d);
    });
    it.querySelector('[data-a="file"]').addEventListener('change', async e => {
     const f = e.target.files && e.target.files[0];
     e.target.value = '';
     if(!f) return;
     try{ simpan(await ttdDariFile(f)); }catch(err){ showToast('Gagal: ' + err.message); }
    });
    const hapus = it.querySelector('[data-a="hapus"]');
    if(hapus) hapus.addEventListener('click', async () => {
     const ok = await prKonfirmasi('Hapus tanda tangan <b>' + esc(t.nama) + '</b>?', 'Ya, hapus');
     if(!ok) return;
     try{
      await exPost('hapusttd', { personId: p.id, pin, kunci: t.kunci });
      showToast('Tanda tangan dihapus');
      muat();
     }catch(e){ showToast('Gagal: ' + e.message); }
    });
    isi.appendChild(it);
   });
  };
  formPin('');
 }

 async function exPost(action, payload){
  if(typeof WEB_APP_URL === 'undefined' || String(WEB_APP_URL).indexOf('https://') !== 0) throw new Error('WEB_APP_URL belum diisi.');
  const body = Object.assign({ action, requesterId: state.personId, pin: state.pin }, payload || {});
  let res;
  try{ res = await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Tidak dapat terhubung ke server.'); }
  const teks=await res.text(); let data;
  try{data=JSON.parse(teks);}catch(e){throw new Error('Respons server tidak valid. Deploy Code.gs terbaru.');}
  if(!data.ok) throw new Error(data.error||'Gagal'); return data;
 }

  }
  const listCard=document.createElement('div');listCard.className='card';listCard.innerHTML=`<h3 style="font-size:15px;margin:0 0 12px;">📚 Arsip PDF</h3>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
    <button class="btn-secondary" data-filter="Laporan Kerja">📄 Laporan Kerja</button><button class="btn-secondary" data-filter="Daftar Hadir">🗓️ Daftar Hadir</button><button class="btn-secondary" data-filter="Semua">📚 Semua</button>
   </div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;">
    <div class="field" style="flex:1;min-width:190px;margin:0;"><label>Anggota / Tim</label><select data-f="anggota"><option value="">Semua anggota / tim</option></select></div>
    <div class="field" style="flex:1;min-width:150px;margin:0;"><label>Bulan</label><select data-f="bulan"><option value="">Semua bulan</option></select></div>
    <div class="field" style="flex:1;min-width:130px;margin:0;"><label>Tahun</label><select data-f="tahun"><option value="">Semua tahun</option></select></div>
    <button type="button" class="btn-secondary" data-f="reset">↺ Reset</button>
   </div>
   <div data-f="ringkasan" style="font-size:13px;color:var(--ink-soft);margin:0 0 10px;"></div>
   <div data-f="list"><div class="empty">Memuat…</div></div>`;wrap.appendChild(listCard);
  const listEl=listCard.querySelector('[data-f="list"]'); let semua=[]; let filter='Laporan Kerja';
  const anggotaEl=listCard.querySelector('[data-f="anggota"]');
  const bulanEl=listCard.querySelector('[data-f="bulan"]');
  const tahunEl=listCard.querySelector('[data-f="tahun"]');
  const ringkasanEl=listCard.querySelector('[data-f="ringkasan"]');
  const bulanMap={'januari':1,'februari':2,'maret':3,'april':4,'mei':5,'juni':6,'juli':7,'agustus':8,'september':9,'oktober':10,'november':11,'desember':12};
  function periodeInfo(s){
    const t=String(s||'').toLowerCase();
    const ym=t.match(/\b(20\d{2})\b/);
    let month='';
    Object.keys(bulanMap).some(n=>{if(t.indexOf(n)>=0){month=String(bulanMap[n]);return true;}return false;});
    if(!month){
      const slash=t.match(/\b(0?[1-9]|1[0-2])\s*[\/-]\s*20\d{2}\b/);
      if(slash) month=String(Number(slash[1]));
    }
    return {year:ym?ym[1]:'',month};
  }
  function isiFilterAnggota(){
    const cur=anggotaEl.value;
    const map=new Map();
    semua.forEach(x=>{const id=String(x.personId||'');const nama=String(x.namaAnggota||'');if(id&&!map.has(id))map.set(id,nama);});
    anggotaEl.innerHTML='<option value="">Semua anggota / tim</option>'+Array.from(map.entries()).sort((a,b)=>a[1].localeCompare(b[1],'id')).map(([id,nama])=>`<option value="${esc(id)}">${esc(nama)}</option>`).join('');
    if([...anggotaEl.options].some(o=>o.value===cur)) anggotaEl.value=cur;
  }
  function isiFilterPeriode(){
    const curM=bulanEl.value, curY=tahunEl.value; const years=new Set();
    semua.forEach(x=>{const pi=periodeInfo(x.periode);if(pi.year)years.add(pi.year);});
    tahunEl.innerHTML='<option value="">Semua tahun</option>'+Array.from(years).sort().reverse().map(y=>`<option value="${y}">${y}</option>`).join('');
    bulanEl.innerHTML='<option value="">Semua bulan</option>'+BULAN_NAMA.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
    if([...tahunEl.options].some(o=>o.value===curY)) tahunEl.value=curY;
    if([...bulanEl.options].some(o=>o.value===curM)) bulanEl.value=curM;
  }
  function renderList(){
    const anggota=anggotaEl.value, bulan=bulanEl.value, tahun=tahunEl.value;
    let data=filter==='Semua'?semua:semua.filter(x=>x.jenis===filter);
    data=data.filter(x=>{
      if(anggota && String(x.personId)!==anggota) return false;
      const pi=periodeInfo(x.periode);
      if(tahun && pi.year!==tahun) return false;
      if(bulan && pi.month!==bulan) return false;
      return true;
    });
    ringkasanEl.textContent=`Menampilkan ${data.length} arsip${semua.length?' dari '+semua.length+' total arsip':''}.`;
    if(!data.length){listEl.innerHTML=`<div class="empty">Tidak ada arsip yang sesuai dengan filter saat ini.</div>`;return;}
    listEl.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Jenis</th><th>Anggota</th><th>Periode</th><th>File</th><th>Diunggah</th><th>Aksi</th></tr></thead><tbody>${data.map(x=>`<tr><td data-label="Jenis">${esc(x.jenis)}</td><td data-label="Anggota">${esc(x.namaAnggota)}</td><td data-label="Periode">${esc(x.periode)}</td><td data-label="File">${esc(x.namaFile)}</td><td data-label="Diunggah">${esc(x.diunggahPada)}</td><td class="row-actions"><button class="btn-secondary" data-pdf="${esc(x.pdfId)}">⬇️ Download</button></td></tr>`).join('')}</tbody></table></div>`;
    listEl.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await exPost('pdf_download',{pdfId:b.dataset.pdf});const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=r.namaFile;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}catch(e){showToast('Gagal download: '+e.message);}b.disabled=false;});
  }
  async function muat(){listEl.innerHTML='<div class="empty">Memuat…</div>';try{const r=await exPost('pdf_list');semua=r.data||[];isiFilterAnggota();isiFilterPeriode();renderList();}catch(e){listEl.innerHTML=`<div class="empty" style="color:var(--libur)">${esc(e.message)}</div>`;}}
  listCard.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList();});
  [anggotaEl,bulanEl,tahunEl].forEach(el=>el.addEventListener('change',renderList));
  listCard.querySelector('[data-f="reset"]').onclick=()=>{anggotaEl.value='';bulanEl.value='';tahunEl.value='';filter='Laporan Kerja';renderList();};
  await muat();
 }

 async function renderKelolaAnggota(container){
  const p=currentPerson();if(!p||!p.isLead)return;
  const card=document.createElement('div');card.className='card';card.innerHTML=`<h3 style="font-size:15px;margin:0 0 6px;">👥 Kelola Anggota Tim</h3><p class="ex-info">Team Leader dapat menambah, mengedit, menghapus anggota, dan menentukan menu yang boleh digunakan.</p><div data-f="list"><div class="empty">Memuat…</div></div>
   <details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">➕ Tambah anggota baru</summary><div style="padding-top:14px" data-f="form"><div class="row"><div class="field"><label>PersonId</label><input data-f="id" placeholder="contoh: budi"></div><div class="field"><label>Nama</label><input data-f="nama" placeholder="Nama lengkap"></div><div class="field"><label>Gelar</label><input data-f="gelar" placeholder="Contoh: S.Kom."></div><div class="field"><label>Jabatan</label><input data-f="jabatan" value="Staff IT"></div></div><div class="row"><div class="field"><label>PIN awal</label><input data-f="pin" type="password" value="0000"></div><div class="field"><label>Email</label><input data-f="email" type="text"></div></div><div class="ex-info">Hak akses awal:</div><div data-f="checks"></div><button class="btn-primary" data-f="add">Tambah Anggota</button></div></details>`;container.appendChild(card);
  const perms=[['beranda','Beranda'],['isiLaporan','Isi Laporan'],['riwayat','Riwayat Laporan Saya'],['presensi','Absensi/Presensi'],['laporanPdf','Arsip PDF']];
  card.querySelector('[data-f="checks"]').innerHTML=perms.map(([k,l])=>`<label style="display:inline-flex;gap:7px;align-items:center;margin:5px 14px 5px 0"><input type="checkbox" data-access="${k}" ${k==='beranda'||k==='isiLaporan'||k==='riwayat'||k==='presensi'?'checked':''}>${l}</label>`).join('');
  function tombolAksi(x){return x.isLead?'—':`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-secondary" data-edit="${esc(x.id)}">✏️ Edit</button><button class="btn-secondary" data-delete="${esc(x.id)}" style="border-color:#e4b0aa;color:#a33;">🗑️ Hapus</button></div>`;}
  async function muat(){const box=card.querySelector('[data-f="list"]');box.innerHTML='<div class="empty">Memuat…</div>';try{const r=await exPost('member_list');box.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Anggota</th><th>Jabatan</th><th>Hak Akses</th><th>Aksi</th></tr></thead><tbody>${r.data.map(x=>`<tr><td>${esc(x.nama)}${x.gelar?`, ${esc(x.gelar)}`:''}${x.isLead?' <span class="pr-badge info">Leader</span>':''}</td><td>${esc(x.jabatan)}</td><td>${perms.map(([k,l])=>`<label style="display:inline-flex;gap:5px;margin-right:8px;font-size:12px"><input type="checkbox" data-member="${esc(x.id)}" data-access="${k}" ${x.isLead||x.access[k]?'checked':''} ${x.isLead?'disabled':''}>${l}</label>`).join('')}</td><td>${tombolAksi(x)}</td></tr>`).join('')}</tbody></table></div>`;
    box.querySelectorAll('input[data-member]:not(:disabled)').forEach(ch=>ch.addEventListener('change',async()=>{const id=ch.dataset.member;const inputs=[...box.querySelectorAll(`input[data-member="${CSS.escape(id)}"]`)];const access={};inputs.forEach(i=>access[i.dataset.access]=i.checked);try{await exPost('member_access',{memberId:id,access});showToast('Hak akses diperbarui');}catch(e){showToast('Gagal: '+e.message);await muat();}}));
    box.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=async()=>{const x=r.data.find(a=>a.id===btn.dataset.edit);if(!x)return;const nama=prompt('Nama anggota:',x.nama);if(nama===null)return;const gelar=prompt('Gelar (opsional):',x.gelar||'');if(gelar===null)return;const jabatan=prompt('Jabatan:',x.jabatan||'Staff IT');if(jabatan===null)return;const pin=prompt('PIN baru (kosong = PIN tetap):','');if(pin===null)return;try{await exPost('member_update',{memberId:x.id,member:{nama:nama.trim(),gelar:gelar.trim(),jabatan:jabatan.trim(),pin:pin.trim(),email:x.email||''}});showToast('Data anggota diperbarui');await muat();}catch(e){showToast('Gagal: '+e.message);}});
    box.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=async()=>{const x=r.data.find(a=>a.id===btn.dataset.delete);if(!x)return;if(!confirm(`Hapus anggota ${x.nama}?\n\nAnggota tidak lagi dapat login, tetapi data laporan/presensi lama tetap disimpan.`))return;try{await exPost('member_delete',{memberId:x.id});showToast('Anggota dihapus');await muat();}catch(e){showToast('Gagal: '+e.message);}});
  }catch(e){box.innerHTML=`<div class="empty" style="color:var(--libur)">${esc(e.message)}</div>`;}}
  card.querySelector('[data-f="add"]').onclick=async()=>{const access={};card.querySelectorAll('[data-f="checks"] input').forEach(i=>access[i.dataset.access]=i.checked);try{await exPost('member_add',{member:{id:card.querySelector('[data-f="id"]').value,nama:card.querySelector('[data-f="nama"]').value,gelar:card.querySelector('[data-f="gelar"]').value,jabatan:card.querySelector('[data-f="jabatan"]').value,pin:card.querySelector('[data-f="pin"]').value,email:card.querySelector('[data-f="email"]').value,access}});showToast('Anggota berhasil ditambahkan');card.querySelector('details').open=false;muat();}catch(e){showToast('Gagal: '+e.message);}};
  await muat();
 }

 /* ---------------- INTEGRASI HALAMAN ---------------- */
 const riwayatAsli = renderRiwayat;
 // Riwayat sekarang murni riwayat; TIDAK lagi menampilkan kartu Buat Laporan.
 // Pembuatan laporan dipindahkan ke Laporan Tim dan hanya untuk Leader.

 const pengaturanAsli = renderPengaturan;
 renderPengaturan = async function(container){ await pengaturanAsli.apply(this,arguments); if(container.isConnected) kartuTandaTangan(container); };

 const timAsli = renderTim;
 renderTim = async function(container){
   await timAsli.apply(this,arguments);
   try{
    const p=currentPerson(); if(!p||!p.isLead)return;
    const anchor=container.querySelector('#detail-area');
    const reportCard=kartuLaporanTim();
    if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(reportCard,anchor); else container.prepend(reportCard);
    const manage=document.createElement('div'); manage.className='card'; manage.innerHTML='<h3 style="font-size:15px;margin:0 0 6px;">👥 Kelola Anggota Tim</h3><p class="ex-info">Tambah anggota baru dan atur hak akses menu melalui checkbox.</p>';
    const btn=document.createElement('button');btn.className='btn-secondary';btn.textContent='Buka Kelola Anggota';btn.onclick=()=>{state.tab='pengaturanAnggota';render();};
    manage.appendChild(btn); if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(manage,anchor); else container.prepend(manage);
   }catch(e){console.error(e);}
 };

 // Tab khusus kelola anggota tidak ditampilkan sebagai sidebar; dibuka dari Laporan Tim.
 const renderAsli = window.render;
 window.render = async function(){
   if(state.tab==='pengaturanAnggota'){
     renderSidebar();renderTopbar();syncUrlHash();const main=document.getElementById('main');main.innerHTML='';const title=document.createElement('div');title.className='view-title';title.innerHTML='<div class="badge-ico">👥</div><div><h2>Kelola Anggota Tim</h2><p>Team Leader menentukan menu dan hak akses anggota.</p></div>';main.appendChild(title);await renderKelolaAnggota(main);return;
   }
   if(state.tab==='laporanPdf'){renderSidebar();renderTopbar();syncUrlHash();const main=document.getElementById('main');main.innerHTML='';await renderLaporanPdf(main);return;}
   return renderAsli.apply(this,arguments);
 };
})();
</script>
